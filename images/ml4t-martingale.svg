  <text x="310" y="228" fill="#A09897" font-size="9">500</text>
  <text x="420" y="228" fill="#A09897" font-size="9">1000</text>
  
  <!-- Unlimited bankroll line (steady rise) -->
  <polyline points="240,220 280,200 320,185 360,175 400,165 440,155 460,130" fill="none" stroke="#C9FB50" stroke-width="2" opacity="0.7"/>
  <text x="460" y="125" fill="#C9FB50" font-size="9" font-family="monospace">unlimited bankroll</text>
  
  <!-- Limited bankroll line (sharp crash) -->
  <polyline points="240,220 260,210 280,200 300,205 320,195 340,200 360,190 380,195 390,210 400,217" fill="none" stroke="#C44444" stroke-width="2" opacity="0.8"/>
