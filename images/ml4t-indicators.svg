" x2="345" y2="85" stroke="#C9FB50" stroke-width="1.5"/><rect x="362" y="75" width="6" height="10" fill="#C44444"/><line x1="365" y1="380" x2="365" y2="75" stroke="#C44444" stroke-width="1.5"/><rect x="382" y="80" width="6" height="10" fill="#C9FB50"/><line x1="385" y1="400" x2="385" y2="90" stroke="#C9FB50" stroke-width="1.5"/><rect x="402" y="85" width="6" height="5" fill="#C44444"/><line x1="405" y1="420" x2="405" y2="85" stroke="#C44444" stroke-width="1.5"/><rect x="422" y="80" width="6" height="5" fill="#C44444"/><line x1="425" y1="445" x2="425" y2="80" stroke="#C44444" stroke-width="1.5"/>
  
