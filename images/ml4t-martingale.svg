.99999999999999" y2="55" stroke="#1E1E2E" stroke-width="1"/><path d="M142.5,63.70834875401149 L120,102.67949192431124 A20,20 0 0,1 127.32050807568876,109.99999999999999 Z" fill="#3A3A4A"/><line x1="120" y1="102.67949192431124" x2="142.5" y2="63.70834875401149" stroke="#1E1E2E" stroke-width="1"/><path d="M166.2916512459885,87.49999999999997 L127.32050807568876,109.99999999999999 A20,20 0 0,1 130,120 Z" fill="#2A2A3A"/><line x1="127.32050807568876" y1="109.99999999999999" x2="166.2916512459885" y2="87.49999999999997" stroke="#1E1E2E" stroke-width="1"/>
  
