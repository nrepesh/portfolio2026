  <!-- Y axis labels -->
  <text x="215" y="50" text-anchor="end" fill="#A09897" font-size="9">+$80</text>
  <text x="215" y="130" text-anchor="end" fill="#A09897" font-size="9">$0</text>
  <text x="215" y="210" text-anchor="end" fill="#A09897" font-size="9">-$1K</text>
  
  <!-- X axis labels -->
